name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.3-stable
  GODOT_DOWNLOAD: Godot_v4.6.3-stable_linux.x86_64.zip
  GODOT_BINARY: Godot_v4.6.3-stable_linux.x86_64

jobs:
  godot:
    name: Godot import, smoke & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_DOWNLOAD}" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/.local/share/godot"
          chmod +x "$HOME/.local/share/godot/${GODOT_BINARY}"

      - name: Add Godot to PATH
        run: echo "$HOME/.local/share/godot" >> "$GITHUB_PATH"

      - name: Install xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: Verify Godot version
        run: ${GODOT_BINARY} --version

      - name: Import project
        run: |
          set -o pipefail
          ${GODOT_BINARY} --headless --path . --import --quit-after 1 2>&1 | tee import.log

      - name: Smoke load main scene
        run: |
          set -o pipefail
          ${GODOT_BINARY} --headless --path . --script res://tools/ci/smoke.gd 2>&1 | tee smoke.log

      - name: Run GdUnit4 tests
        run: |
          set -o pipefail
          chmod +x ./addons/gdUnit4/runtest.sh
          export GODOT_BIN="$HOME/.local/share/godot/${GODOT_BINARY}"
          xvfb-run --auto-servernum ./addons/gdUnit4/runtest.sh -a res://test 2>&1 | tee gdunit.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-ci-logs
          path: |
            import.log
            smoke.log
            gdunit.log
            reports/
          if-no-files-found: ignore
